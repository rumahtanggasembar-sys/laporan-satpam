<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan Satpam</title>
<meta name="theme-color" content="#1F3864">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin:0; height:100%; background:#F3F5F9; font-family:Arial, Helvetica, sans-serif; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; }
  #pesan { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
           text-align:center; padding:24px; color:#1F3864; font-size:16px; line-height:1.5; background:#F3F5F9; }
  #pesan img { width:96px; height:96px; border-radius:20px; margin-bottom:16px; }
  #pesan button { margin-top:16px; background:#1F3864; color:#fff; border:none; border-radius:10px; padding:12px 22px; font-size:16px; }
  .putar { width:36px; height:36px; border:4px solid #D6DCE8; border-top-color:#1F3864; border-radius:50%;
           animation:putar 1s linear infinite; margin-top:12px; }
  @keyframes putar { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="pesan"><img src="icon-192.png" alt=""><div id="teks">Memuat aplikasi...</div><div class="putar" id="putar"></div></div>
<iframe id="app" title="Laporan Satpam" allow="camera; geolocation; clipboard-write"></iframe>

<script>
// =====================================================================
// GANTI TULISAN DI ANTARA TANDA KUTIP DI BAWAH INI
// dengan link aplikasi Apps Script (yang diakhiri /exec).
// =====================================================================
var LINK_APLIKASI = 'https://script.google.com/macros/s/AKfycbwbDGWO63yWHBgwwaEJCsO2hsEtIqTxi7tmUMY9akEITDNtfY5z0HskIIpkkc9mJ15V/exec';
// =====================================================================

(function () {
  var pesan = document.getElementById('pesan');
  var teks = document.getElementById('teks');
  var putar = document.getElementById('putar');
  var app = document.getElementById('app');

  function tampilPesan(isi, tombol) {
    pesan.style.display = 'flex';
    putar.style.display = 'none';
    teks.innerHTML = isi;
    if (tombol) {
      var b = document.createElement('button');
      b.textContent = 'Coba lagi';
      b.onclick = function () { location.reload(); };
      pesan.appendChild(b);
    }
  }

  if (LINK_APLIKASI.indexOf('/exec') < 0) {
    tampilPesan('Link aplikasi belum diisi.<br>Admin: isi LINK_APLIKASI di file index.html.');
    return;
  }
  if (!navigator.onLine) {
    tampilPesan('Tidak ada sinyal internet.<br>Periksa data seluler atau Wi-Fi.', true);
    return;
  }

  app.onload = function () { pesan.style.display = 'none'; };
  app.src = LINK_APLIKASI;
  setTimeout(function () {
    if (pesan.style.display !== 'none') {
      teks.innerHTML = 'Masih memuat...<br>Bila lama, periksa sinyal.';
    }
  }, 15000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
